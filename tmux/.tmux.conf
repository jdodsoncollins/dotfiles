
# Rebind prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse + long scrollback
set -g mouse on
set -g history-limit 50000

# Start numbering at 1 (easier to reach on keyboards)
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on
setw -g wrap-search off

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Intuitive splits (prefix + | and -)
bind | split-window -h
bind - split-window -v

# 256 color + true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Preserve modified keys for TUIs such as Codex and Claude.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Status line sits on Ghostty glass (bg=default)
set -g status-interval 5
set -g status-justify centre
set -g status-style bg=default,fg=green
set -g status-left-length 30
set -g status-left '[ #[fg=green,bold]#h #[fg=default,default]]'
set -g status-right-length 60
set -g status-right '[#[fg=cyan,bold]%m/%d %H:%M#[fg=default,default]]'
setw -g window-status-current-format '#[fg=red,bold](#[fg=white,bold]#I:#W#F#[fg=red,bold])#[fg=default,default]'
setw -g window-status-current-style bright
setw -g window-status-style fg=white
setw -g window-status-last-style fg=cyan
setw -g window-status-activity-style fg=yellow,bold
setw -g window-status-bell-style fg=yellow,bold
