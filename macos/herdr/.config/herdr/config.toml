onboarding = false

[theme]
name = "tokyo-night"

[theme.custom]
sidebar_bg = "#16161e"
panel_bg = "#1a1b26"
active_row_bg = "#283457"
selection_bg = "#3d59a1"
accent = "#7aa2f7"

[ui]
sidebar_width = 32
sidebar_min_width = 26
sidebar_max_width = 42
mobile_width_threshold = 100
mouse_scroll_lines = 5

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.spaces]
row_gap = 1
