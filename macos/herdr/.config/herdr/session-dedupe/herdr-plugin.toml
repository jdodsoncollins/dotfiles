id = "session-dedupe"
name = "Agent Session Dedupe"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Closes idle duplicate opencode session panes after a grace period without issuing shared focus commands. Busy and unknown-status panes are never closed."
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "index.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.mjs"]

[[events]]
on = "pane.focused"
command = ["node", "index.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "index.mjs"]

[[actions]]
id = "scan"
title = "Close duplicate agent session panes"
command = ["node", "index.mjs"]
