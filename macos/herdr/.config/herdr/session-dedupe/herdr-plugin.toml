id = "session-dedupe"
name = "Agent Session Dedupe"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Keeps each agent session in one pane. When a second pane opens a session that is already live, focus moves to the original tab and the idle duplicate closes after a grace period. Busy panes are never closed."
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "index.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.mjs"]

[[events]]
on = "pane.focused"
command = ["node", "index.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "index.mjs"]

[[actions]]
id = "scan"
title = "Close duplicate agent session panes"
command = ["node", "index.mjs"]
