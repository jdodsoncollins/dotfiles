id = "last-reply"
name = "Agent Last Reply Time"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Sidebar metadata for agent panes: last-reply time, Git branch and worktree, and a new-opencode-tab action. Tab naming is handled by the herdr-automatic-rename plugin."
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.js"]

[[events]]
on = "pane.focused"
command = ["node", "index.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.js"]

[[actions]]
id = "new-opencode-tab"
title = "New tab running opencode"
command = ["node", "new-tab.js"]