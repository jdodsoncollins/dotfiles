id = "last-reply"
name = "Agent Last Reply Time"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Timestamp each agent pane's most recent reply, name tabs after their opencode session topic, and open new opencode tabs"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.js"]

[[events]]
on = "pane.focused"
command = ["node", "index.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.js"]

[[actions]]
id = "new-opencode-tab"
title = "New tab running opencode"
command = ["node", "new-tab.js"]